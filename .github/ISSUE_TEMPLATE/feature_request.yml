name: Sugerir recurso
description: Proponha uma melhoria para o MP4 Studio.
title: "[Recurso]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual dificuldade esse recurso resolveria?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
