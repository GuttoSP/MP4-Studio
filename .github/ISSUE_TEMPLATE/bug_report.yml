name: Relatar erro
description: Registre um problema reproduzível do MP4 Studio.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Não envie vídeos privados, bancos SQLite, logs pessoais ou conteúdo de projetos reais.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva objetivamente o erro.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra...
        2. Importe uma mídia sintética...
        3. Clique em...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou versão
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
  - type: textarea
    id: notes
    attributes:
      label: Informações adicionais não confidenciais
